# 공공기관 SNS 트렌드 리서치 - 대상 채널 설정
#
# youtube.resolve_by 옵션:
#   - "channel_id" : 가장 안정적. UC로 시작하는 24자리 채널 ID (권장)
#   - "username"   : 레거시 유튜브 사용자명 (예: /user/xxxx 형태 URL)
#   - "search"     : 채널 ID/사용자명을 모를 때, 채널명으로 검색해서 첫 결과 사용 (가장 불안정 - 가급적 채널 ID로 교체할 것)
#
# NOTE: 데모 단계에서는 정확한 채널 ID를 다 파악하지 못해 일부는 username/search로 넣었습니다.
#       운영 전환 시 YouTube Studio > 설정 > 채널 > 고급 설정에서 정확한 채널 ID를 확인해 교체하는 것을 권장합니다.

organizations:
  - name: 고용노동부
    slug: moel
    youtube:
      resolve_by: username
      value: moelkorea
    instagram:
      url: https://www.instagram.com/moel.tomorrow/

  - name: 국가유산청
    slug: khs
    youtube:
      resolve_by: username
      value: chluvu
    instagram:
      url: https://www.instagram.com/chlove_u/

  - name: 국립중앙박물관
    slug: nmk
    youtube:
      resolve_by: username
      value: koreanmuseum
    instagram:
      url: https://www.instagram.com/nationalmuseumofkorea/

  - name: 보건복지부
    slug: mohw
    youtube:
      resolve_by: username
      value: mohwpr
    instagram:
      url: https://www.instagram.com/mohw_kr/

  - name: 코레일
    slug: korail
    youtube:
      resolve_by: search
      value: 코레일TV 한국철도공사
    instagram:
      url: https://www.instagram.com/korail_official_/

# 채널당 최근 영상 몇 개까지 확인할지 / 리포트에 몇 개씩 큐레이션할지
settings:
  youtube_lookback_videos: 10
  youtube_top_n: 3
  instagram_lookback_posts: 6
  instagram_top_n: 3
